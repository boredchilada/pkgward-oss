# LLM-triage labeled evaluation set.
#
# Each [[sample]] is a REAL published package fetched live at bench time (same
# adapter.fetch path prod uses), analyzed through the real static seam, then run
# through llm.triage.triage(). The harness scores three axes (see tools/llm_eval/run_eval.py):
#
#   bad  sample  -> PASS if triage verdict != "benign"        (no-suppress; catastrophic if it clears)
#   good sample  -> CLEARED  if verdict == "benign"           (the value: removes the FP)
#                -> ESCALATED if verdict == "malicious"        (the production failure we are fixing)
#                -> verdict suspicious/inconclusive on a good  = neutral (no malicious alert fires)
#
# The 2026-06 benchmark only measured no-suppress + cleared. It had NO over-escalation
# axis, which is exactly why deepseek-v4-flash scored "perfect" yet generated the
# 2026-06-07 FP alert surge. This set adds the adjudicated FPs that expose it.
#
# `failure` records what the CURRENT (deepseek-v4-flash + baseline prompt) model did
# on this sample in the wild, for regression tracking. `driver` = what produced the
# bad alert: "llm" (rules only suspicious, LLM escalated) or "rules+llm" (both
# malicious -> ALSO auto-watchlisted, the worst case).
#
# Provenance: adjudicated locally 2026-06-07 (this session) + 2026-06-07 earlier
# (stickcode, hellyeah). All "good" verdicts confirmed by reading the actual source.

# ---------------------------------------------------------------------------
# GOOD — benign packages the scanner false-flagged. The over-escalation axis.
# ---------------------------------------------------------------------------

[[sample]]
ecosystem = "npm"
name = "@prestyj/pixel"
version = "4.3.101"
label = "good"
driver = "llm"            # rule=suspicious(30); LLM escalated to malicious 95%
failure = "escalated"
notes = "Legit error-tracking SDK. install() is a `bin` CLI subcommand (cli.js guards on args.command), NOT an npm lifecycle hook. workers.dev is its own ingest backend. Tests: lifecycle-vs-CLI + first-party-destination."

[[sample]]
ecosystem = "npm"
name = "ainx"
version = "1.13.23"
label = "good"
driver = "rules+llm"      # rule=malicious(82) + LLM malicious(95) -> auto-watchlisted
failure = "escalated"
notes = "Legit Pterodactyl/Blueprint CLI (rjweb/0x4096). `bun build --minify` bundle; createDecipheriv helper is dead code, eval belongs to deps; no lifecycle hook. Tests: obfuscation+data-flow + minified-bundle."

