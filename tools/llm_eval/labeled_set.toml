# ---------------------------------------------------------------------------
# BAD — real malware. The no-suppress axis. NEVER let the model clear these.
# ---------------------------------------------------------------------------

[[sample]]
ecosystem = "npm"
name = "nodepathbalance54"
version = "1.1.0"
label = "bad"
failure = "none"          # caught: rule=suspicious(30), LLM correctly escalated malicious 95%
notes = "Telegram-bot stealer, runs on require(). Hardcoded bot token + chatId; ipify + os.networkInterfaces; POST to api.telegram.org/sendMessage. Dependency-confusion family (deps on nodepathbalance45). Concrete visible mechanism — must stay convicted under the reinforced prompt."

[[sample]]
ecosystem = "npm"
name = "mlamp-captcha-web-sdk"
version = "1.0.0"
label = "bad"
failure = "none"          # caught: rule=suspicious(46), LLM correctly escalated malicious 95%
notes = "postinstall char-code payload spawns detached --eval child: gates on npm_package_*, evades sandboxes (NODE_OPTIONS --require, AWS dummy keys), exfils hostname/user/NIC-IPs/env to XOR-obfuscated host. Concrete visible mechanism — must stay convicted."

