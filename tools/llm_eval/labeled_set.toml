failure = "escalated"
notes = "Official Expo App Store Connect tool, ~882K dl/wk. @vercel/ncc bundle (not malicious obf); iocs.ipv4 are X.509 OID strings (2.5.4.3). Tests: minified-bundle + base64/OID-as-IP + first-party-destination."

