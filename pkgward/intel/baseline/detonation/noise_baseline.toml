# Per-ecosystem noise filters for the detonation Go sandbox service.
# Trace events matching these patterns are dropped before behavioral rules
# evaluate them — they're the expected, normal behavior of pip/npm/cargo
# themselves. UNION semantics on each list.

# PyPI: pip's own writes / cache reads / vendored module loads.
pypi_file_noise = [
    "/site-packages/",
    "/.cache/pip/",
    "/tmp/pip-",
    "/__pycache__/",
    "/pip/_vendor/",
    ".dist-info/",
    ".egg-info/",
]

# PyPI: exec of the interpreter itself / pip binary.
pypi_exec_noise = [
    "/python",
    "/pip",
]

# npm: cache / lockfile / node_modules churn + npm's own .npmrc reads.
npm_file_noise = [
    "/.npm/_cacache/",
    "/.npm/_logs/",
    "/node_modules/",
    "/tmp/npm-",
    "/.npmrc",
]

# npm: exec of node / npm.
npm_exec_noise = [
    "/node",
    "/npm",
]

# crates.io: cargo's own work paths.
crates_file_noise = [
    "/.cargo/registry/",
    "/.cargo/bin/",
    "/.rustup/",
    "/target/",
]

# crates.io: exec of rust toolchain.
crates_exec_noise = [
    "/rustc",
    "/cargo",
    "/rustup",
]

# Go modules: go build cache + module cache + toolchain install paths.
gomod_file_noise = [
    "/go/pkg/mod/",
    "/go/pkg/",
    "/root/.cache/go-build/",
    "/.cache/go-build/",
    "/usr/local/go/",
]

# Go modules: exec of go toolchain + archive extraction (unzip/tar).
gomod_exec_noise = [
    "/go",
    "/compile",
    "/link",
    "/asm",
    "/vet",
    "/gofmt",
    "/unzip",
    "/tar",
]

# Per-ecosystem network destination allowlist. Entries may be hostnames (resolved
# to IPs at detonation time), literal IPs, or CIDR ranges. Connections to these
# expected registry / CDN endpoints are dropped before the network exfil rules
# run, so normal dependency fetches don't false-positive as
# dyn_install_exfil/dyn_import_exfil. CIDR ranges cover the CDN fronts whose IPs
# rotate faster than per-detonation DNS resolution can track (mined from
# trace_event) — scoped per-ecosystem to the CDN its registry actually sits behind.
pypi_net_allow = [
    "pypi.org",
    "files.pythonhosted.org",
    "github.com",
    "objects.githubusercontent.com",
    "raw.githubusercontent.com",
    "151.101.0.0/16",   # Fastly (pythonhosted/pypi front)
    "146.75.0.0/16",    # Fastly
    "199.232.0.0/16",   # Fastly
]

npm_net_allow = [
    "registry.npmjs.org",
    "registry.yarnpkg.com",
    "github.com",
    "codeload.github.com",
    "objects.githubusercontent.com",
    "raw.githubusercontent.com",
    "release-assets.githubusercontent.com",
    "nodejs.org",
    "registry.npmmirror.com",
    "npmmirror.com",
    "cdn.jsdelivr.net",
    "unpkg.com",
    "yarnpkg.com",
    "104.16.0.0/13",    # Cloudflare (npmjs/jsdelivr/unpkg front)
    "151.101.0.0/16",   # Fastly
    "146.75.0.0/16",    # Fastly
    "199.232.0.0/16",   # Fastly
    "3.160.0.0/14",     # AWS CloudFront (release assets)
]

crates_net_allow = [
    "crates.io",
    "static.crates.io",
    "index.crates.io",
    "github.com",
    "objects.githubusercontent.com",
    "codeload.github.com",
    "104.16.0.0/13",    # Cloudflare (crates.io front)
    "3.160.0.0/14",     # AWS CloudFront (static.crates.io)
]

gomod_net_allow = [
    "proxy.golang.org",
    "sum.golang.org",
    "storage.googleapis.com",
    "github.com",
    "objects.githubusercontent.com",
    "gopkg.in",
    "golang.org",
    "goproxy.io",
    "142.250.0.0/15",   # Google (proxy.golang.org / googleapis front)
    "64.233.160.0/19",  # Google
    "192.178.0.0/15",   # Google
]
