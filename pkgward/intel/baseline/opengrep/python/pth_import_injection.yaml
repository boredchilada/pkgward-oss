rules:
  - id: pth_import_injection
    message: >-
      .pth file content containing 'import' — Python executes any line in a
      .pth file that begins with 'import' at interpreter startup. Standard
      attack vector for persistence inside a package install.
    languages: [generic]
    severity: ERROR
    metadata:
      severity: critical
      confidence: high
      category: malware
      pkgward_layer: opengrep
    paths:
      include:
        - "*.pth"
    patterns:
      # Match the WHOLE import line, not just `import <name>` — the pattern-not-regex
      # below filters on the matched span, so a narrow `^\s*import\s+\S+` span (just
      # "import sys") never contains the coverage tokens and the exclusion silently
      # fails, FP-ing on coverage.py's .pth (the case this rule means to skip).
      - pattern-regex: '^\s*import\s+.+'
      # coverage.py's subprocess-measurement .pth (bundled test venvs ship it).
      - pattern-not-regex: 'COVERAGE_PROCESS_(START|CONFIG).*coverage\.process_startup'
